<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Fat square caret - bold rectangular block -->
  <rect x="20" 
        y="20" 
        width="80" 
        height="80" 
        fill="#000000" 
        stroke="#000000" 
        stroke-width="2"/>
  
  <!-- Letter K inside - bold and centered -->
  <text x="60" 
        y="78" 
        font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" 
        font-size="56" 
        font-weight="700" 
        text-anchor="middle" 
        fill="#ffffff">k</text>
</svg>
