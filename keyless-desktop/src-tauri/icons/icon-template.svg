<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Monochrome template for macOS tray (black = visible, transparent = hole) -->
  <rect x="20" 
        y="20" 
        width="80" 
        height="80" 
        fill="#000000"/>
  
  <!-- Letter K cutout - inverted for template mode -->
  <text x="60" 
        y="78" 
        font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" 
        font-size="56" 
        font-weight="700" 
        text-anchor="middle" 
        fill="#ffffff">k</text>
</svg>

