[package]
name = "keyless-desktop"
version = "0.3.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
license = "MIT"
repository = "https://github.com/hate/keyless"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "keyless_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-devtools = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
thiserror = "1"
cpal = "0.15"

# workspace crates
keyless-core = { path = "../../keyless-core" }
keyless-runtime = { path = "../../keyless-runtime" }
keyless-audio = { path = "../../keyless-audio" }
keyless-output = { path = "../../keyless-output" }
keyless-whisper = { path = "../../keyless-whisper" }
keyless-logging = { path = "../../keyless-logging" }
keyless-models = { path = "../../keyless-models" }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.24"
