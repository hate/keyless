[package]
name = "keyless-runtime"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
keyless-core = { path = "../keyless-core" }
keyless-audio = { path = "../keyless-audio" }
keyless-whisper = { path = "../keyless-whisper" }
keyless-output = { path = "../keyless-output" }
keyless-models = { path = "../keyless-models" }
# Disable default features so `key_names` stays off via our patched rdev
rdev = { version = "0.5", default-features = false }
tracing = "0.1"
smallvec = "1"

[dev-dependencies]
tempfile = "3"
