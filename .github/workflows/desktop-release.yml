name: Release Desktop App

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Desktop App (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: keyless-desktop-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: keyless-desktop-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: keyless-desktop-windows-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: keyless-desktop-linux-x86_64

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"
          cache-dependency-path: keyless-desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libx11-dev libxi-dev libxtst-dev libxrandr-dev libxext-dev libxrender-dev libxfixes-dev libxcomposite-dev libxcursor-dev libxdo-dev pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install frontend deps
        run: pnpm -C keyless-desktop install --frozen-lockfile

      - name: Build desktop (release)
        run: pnpm -C keyless-desktop tauri build --target ${{ matrix.target }}

      - name: Prepare bundle artifacts
        shell: bash
        run: |
          mkdir -p bundle-artifacts
          # Find and copy all installer files
          find keyless-desktop/src-tauri/target -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -exec cp {} bundle-artifacts/ \;
          # Also try the expected bundle directory structure
          if [ -d "keyless-desktop/src-tauri/target/${{ matrix.target }}/release/bundle" ]; then
            cp -r keyless-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/* bundle-artifacts/ 2>/dev/null || true
          fi
          if [ -d "keyless-desktop/src-tauri/target/release/bundle" ]; then
            cp -r keyless-desktop/src-tauri/target/release/bundle/* bundle-artifacts/ 2>/dev/null || true
          fi
          ls -lh bundle-artifacts/ || echo "No bundle artifacts found"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: bundle-artifacts/**
          if-no-files-found: warn

  release:
    name: Create Desktop App Release
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Find and prepare release files
        shell: bash
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Create Desktop App release
        uses: softprops/action-gh-release@v2
        with:
          name: keyless ${{ github.ref_name }}
          body: |
            ## keyless Desktop Release

            Desktop application version of keyless with GUI.

            Download the installer for your platform:
            - Linux: `.deb` or `.rpm` package
            - macOS: `.dmg` installer
            - Windows: `.msi` installer
          files: release-files/*
          draft: false
          prerelease: false
