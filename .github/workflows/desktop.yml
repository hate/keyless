name: desktop

on:
  pull_request:
    branches: [main, desktop]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"
          cache-dependency-path: keyless-desktop/pnpm-lock.yaml

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install frontend deps
        run: pnpm -C keyless-desktop install --frozen-lockfile

      - name: Build desktop (debug for PRs)
        if: github.event_name == 'pull_request'
        run: pnpm -C keyless-desktop tauri build --debug
