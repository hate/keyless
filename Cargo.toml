[workspace]
members = [
    "keyless",
    "keyless-core",
    "keyless-audio",
    "keyless-output",
    "keyless-whisper",
    "keyless-logging",
    "keyless-models",
    "keyless-runtime",
    "keyless-desktop/src-tauri",
]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hate/keyless"
homepage = "https://keyless.sh"

[patch.crates-io]
# Use our fork with feature-gated key names; branch disables TIS/HIToolbox for our build.
rdev = { git = "https://github.com/hate/rdev", branch = "macos-no-key-names" }
