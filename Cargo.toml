[workspace]
members = [
    "keyless",
    "keyless-core",
    "keyless-audio",
    "keyless-output",
    "keyless-whisper",
    "keyless-logging",
    "keyless-models",
    "keyless-runtime",
    "keyless-desktop/src-tauri",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hate/keyless"
homepage = "https://keyless.sh"
