[package]
name = "keyless"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false
license.workspace = true

[dependencies]
keyless-core = { path = "../keyless-core" }
keyless-audio = { path = "../keyless-audio" }
keyless-output = { path = "../keyless-output" }
keyless-whisper = { path = "../keyless-whisper" }
keyless-models = { path = "../keyless-models" }
keyless-runtime = { path = "../keyless-runtime" }
keyless-logging = { path = "../keyless-logging" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
clap = { version = "4", features = ["derive"] }
ratatui = { version = "0.29.0", default-features = false, features = [
    "crossterm",
] }
crossterm = "0.27"
dirs-next = "2"
serde_json = "1"

[features]
default = []
# Enable CUDA backend in the whisper engine when requested
cuda = ["keyless-whisper/cuda"]

[dev-dependencies]
serde_json = "1"
candle-transformers = "0.8"
tempfile = "3"
