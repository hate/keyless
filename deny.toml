[advisories]
# Ignore advisories that are either not relevant to macOS build or acceptable transients
ignore = [
    { id = "RUSTSEC-2024-0436" },
    { id = "RUSTSEC-2024-0429" }, # glib unsound VariantStrIter (GTK3 path, not used on macOS)
]
unmaintained = "workspace"

[bans]
# Warn on multiple versions of the same crate
multiple-versions = "warn"

[sources]
# Only allow crates.io (strictest security/reproducibility)
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Block all git dependencies (ensures reproducible builds)
allow-git = []

[licenses]
# Allow common open source licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "MPL-2.0",
    "Unlicense",
    "BSL-1.0",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "NCSA",
]
